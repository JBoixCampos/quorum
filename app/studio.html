<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quorum Studio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body class="studio">
  <header class="s-top">
    <strong class="s-brand">Studio</strong>
    <span class="s-title" data-title></span>
    <span class="s-spacer"></span>
    <button type="button" data-act="undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
    <button type="button" data-act="redo" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
    <span class="s-sep"></span>
    <button type="button" data-act="remix" title="See this slide laid out other ways">Remix</button>
    <button type="button" data-act="source" aria-pressed="false" title="The Markdown of this slide">Source</button>
    <button type="button" data-act="add" title="Add a slide after this one">Add slide</button>
    <span class="s-sep"></span>
    <button type="button" class="s-warn" data-act="warnings" hidden></button>
    <span class="s-status" data-status>Loading</span>
  </header>

  <aside class="s-rail" data-rail aria-label="Slides"></aside>

  <main class="s-center">
    <div class="s-canvas-wrap" data-wrap>
      <div class="s-canvas" data-canvas>
        <iframe data-frame title="The slide"></iframe>
        <div class="s-drop" data-drop hidden>Drop a picture here</div>
      </div>
    </div>
    <section class="s-source" data-source hidden>
      <div class="s-source-head"><b>Markdown of this slide</b><span class="s-muted" data-source-note></span></div>
      <textarea data-source-text spellcheck="false" aria-label="Markdown of this slide"></textarea>
    </section>
  </main>

  <aside class="s-inspector">
    <nav class="s-tabs" role="tablist">
      <button type="button" role="tab" data-tab="slide" aria-selected="true">Slide</button>
      <button type="button" role="tab" data-tab="element" aria-selected="false">Element</button>
      <button type="button" role="tab" data-tab="talk" aria-selected="false">Talk</button>
    </nav>
    <div class="s-panel" data-panel="slide"></div>
    <div class="s-panel" data-panel="element" hidden></div>
    <div class="s-panel" data-panel="talk" hidden></div>
  </aside>

  <div class="s-editor" data-editor hidden>
    <textarea data-editor-text spellcheck="false" aria-label="Markdown of the selected element"></textarea>
    <div class="s-editor-bar"><span class="s-muted">Ctrl+Enter saves, Esc cancels</span><span class="s-spacer"></span><button type="button" data-editor-cancel>Cancel</button><button type="button" class="main" data-editor-save>Save</button></div>
  </div>

  <div class="s-modal" data-modal hidden>
    <div class="s-modal-card">
      <header><strong data-modal-title></strong><span class="s-spacer"></span><button type="button" data-modal-close>Close</button></header>
      <div class="s-modal-body" data-modal-body></div>
    </div>
  </div>
  <div class="s-toast" data-toast hidden role="status"></div>

  <script type="module" src="js/studio.js"></script>
</body>
</html>
