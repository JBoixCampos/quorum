<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quorum</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/present.css">
  <link rel="stylesheet" href="css/design.css">
</head>
<body class="present">
  <div class="q-stage" data-stage>
    <main class="q-slide" data-slide></main>
    <div class="q-reactions" data-reactions aria-hidden="true"></div>
    <footer class="q-footer" data-footer></footer>
    <div class="q-corner-qr" data-corner hidden></div>
    <div class="q-logo" data-logo hidden></div>
  </div>
  <aside class="q-notes" data-notes hidden></aside>
  <div class="q-preview-bar" data-preview hidden></div>
  <script type="module" src="js/present.js"></script>
</body>
</html>
