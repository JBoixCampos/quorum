<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">How a request travels</title>
  <desc id="d">You press Ask agent in Studio. Studio saves a request file. Your agent claims it, edits the slide and checks it, then closes the request with a note. Studio shows the change and the note.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9z" fill="#8b7bff"/></marker>
    <style>
      text { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #ececef; }
      .h { font-size: 17px; font-weight: 600; }
      .s { font-size: 13.5px; fill: #b5b8c0; }
      .m { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; fill: #ececef; }
      .k { font-size: 12.5px; font-weight: 600; fill: #8b7bff; }
      .n { font-size: 13px; font-weight: 600; fill: #0e0f11; }
      .box { fill: #17181c; stroke: #363a42; stroke-width: 1.5; }
      .ln { stroke: #8b7bff; stroke-width: 2; fill: none; }
      .pill { fill: #1e2025; stroke: #363a42; }
    </style>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#0e0f11" stroke="#2a2d33"/>

  <text class="k" x="40" y="46">You</text>
  <text class="k" x="260" y="46">The folder</text>
  <text class="k" x="480" y="46">Your agent</text>
  <text class="k" x="700" y="46">Your agent</text>
  <text class="k" x="920" y="46">You</text>

  <g>
    <rect class="box" x="40" y="62" width="200" height="190" rx="14"/>
    <circle cx="68" cy="92" r="12" fill="#8b7bff"/><text class="n" x="68" y="97" text-anchor="middle">1</text>
    <text class="h" x="88" y="97">Ask agent</text>
    <text class="s" x="58" y="132">Select a slide, say</text>
    <text class="s" x="58" y="152">what you want:</text>
    <text class="s" x="58" y="182">"make this a chart"</text>
  </g>
  <path class="ln" d="M242 157H258" marker-end="url(#a)"/>
  <g>
    <rect class="box" x="260" y="62" width="200" height="190" rx="14"/>
    <circle cx="288" cy="92" r="12" fill="#8b7bff"/><text class="n" x="288" y="97" text-anchor="middle">2</text>
    <text class="h" x="308" y="97">A file</text>
    <text class="m" x="278" y="134">requests/r-4f2a1c.md</text>
    <text class="s" x="278" y="162">The slide, your words,</text>
    <text class="s" x="278" y="182">the lines to change.</text>
    <rect class="pill" x="278" y="206" width="64" height="24" rx="12"/><text class="s" x="310" y="223" text-anchor="middle">open</text>
  </g>
  <path class="ln" d="M462 157H478" marker-end="url(#a)"/>
  <g>
    <rect class="box" x="480" y="62" width="200" height="190" rx="14"/>
    <circle cx="508" cy="92" r="12" fill="#8b7bff"/><text class="n" x="508" y="97" text-anchor="middle">3</text>
    <text class="h" x="528" y="97">Claim it</text>
    <text class="m" x="498" y="134">quorum requests</text>
    <text class="m" x="498" y="154">  claim r-4f2a1c</text>
    <text class="s" x="498" y="182">Only one agent can.</text>
    <rect class="pill" x="498" y="206" width="132" height="24" rx="12"/><text class="s" x="564" y="223" text-anchor="middle">working: claude</text>
  </g>
  <path class="ln" d="M682 157H698" marker-end="url(#a)"/>
  <g>
    <rect class="box" x="700" y="62" width="200" height="190" rx="14"/>
    <circle cx="728" cy="92" r="12" fill="#8b7bff"/><text class="n" x="728" y="97" text-anchor="middle">4</text>
    <text class="h" x="748" y="97">Do the work</text>
    <text class="s" x="718" y="134">Edits the slide, runs</text>
    <text class="m" x="718" y="156">quorum check</text>
    <text class="s" x="718" y="182">then closes it with</text>
    <text class="s" x="718" y="202">a note:</text>
    <text class="m" x="718" y="226">requests done --note</text>
  </g>
  <path class="ln" d="M902 157H918" marker-end="url(#a)"/>
  <g>
    <rect class="box" x="920" y="62" width="240" height="190" rx="14"/>
    <circle cx="948" cy="92" r="12" fill="#8b7bff"/><text class="n" x="948" y="97" text-anchor="middle">5</text>
    <text class="h" x="968" y="97">See the result</text>
    <text class="s" x="938" y="134">The slide changes in Studio</text>
    <text class="s" x="938" y="154">as soon as it is saved.</text>
    <text class="s" x="938" y="182">The note shows in the</text>
    <text class="s" x="938" y="202">Team tab.</text>
    <rect class="pill" x="938" y="218" width="64" height="24" rx="12"/><text class="s" x="970" y="235" text-anchor="middle">done</text>
  </g>

  <text class="s" x="600" y="296" text-anchor="middle">Nothing is pasted and no server sits in the middle: the request, the claim and the note are all files.</text>
  <text class="s" x="600" y="320" text-anchor="middle">An agent in the cloud sees them once you send them with git (the Team tab has a Send button).</text>
</svg>
